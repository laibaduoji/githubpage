<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TG Mini App · Ramp iframe 测试</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1a1a1a;
        background: #f0f2f5;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 18px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .toolbar input {
        flex: 1 1 280px;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      .toolbar button {
        padding: 8px 14px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }
      .toolbar button:hover {
        opacity: 0.9;
      }
      .iframe-url {
        margin: 0 0 10px;
        padding: 8px 10px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        word-break: break-all;
      }
      .iframe-url strong {
        color: #666;
        font-weight: 600;
        margin-right: 6px;
      }
      .hint {
        margin: 0 0 10px;
        font-size: 12px;
        color: #666;
      }
      #viewer {
        display: block;
        width: 100%;
        min-height: 600px;
        height: 70vh;
        border: 1px solid #c5c5c5;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08),
          0 12px 24px rgba(0, 0, 0, 0.12);
      }
      .log {
        margin-top: 12px;
        padding: 10px;
        background: #111;
        color: #9fef00;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .log-empty {
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>TG Mini App · Ramp iframe 测试</h1>

    <div class="toolbar">
      <input
        id="url-input"
        type="url"
        value=""
        placeholder="粘贴 Ramp 入口 URL（含 appId=qx6UINl9GcM51rwf）"
      />
      <button id="open-iframe-btn" type="button">iframe 内打开</button>
    </div>

    <p class="hint">
      模拟 TG 父页：Ramp 在 iframe 内，通过
      <code>window.parent.postMessage</code> 上报
      <code>type: "orderClosed"</code>。本页监听该消息并打日志（正式 TG
      侧可在此关闭 Mini App）。
    </p>

    <p class="iframe-url">
      <strong>iframe 链接：</strong>
      <span id="iframe-url-text">（尚未加载）</span>
    </p>

    <iframe id="viewer" title="Ramp" src="about:blank"></iframe>

    <div id="message-log" class="log log-empty">等待 Ramp postMessage…</div>

    <script>
      var urlInput = document.getElementById("url-input");
      var iframe = document.getElementById("viewer");
      var iframeUrlText = document.getElementById("iframe-url-text");
      var messageLog = document.getElementById("message-log");

      function normalizeUrl(raw) {
        var url = (raw || "").trim();
        if (!url) return "";
        if (!/^https?:\/\//i.test(url)) {
          url = "https://" + url;
        }
        urlInput.value = url;
        return url;
      }

      function updateIframeUrlDisplay() {
        var shown = iframe.getAttribute("src") || "";
        try {
          shown = iframe.contentWindow.location.href || shown;
        } catch (e) {}
        iframeUrlText.textContent = shown || "（尚未加载）";
      }

      function appendLog(line) {
        if (messageLog.classList.contains("log-empty")) {
          messageLog.classList.remove("log-empty");
          messageLog.textContent = "";
        }
        var time = new Date().toISOString().slice(11, 23);
        messageLog.textContent += "[" + time + "] " + line + "\n";
        messageLog.scrollTop = messageLog.scrollHeight;
      }

      document
        .getElementById("open-iframe-btn")
        .addEventListener("click", function () {
          var url = normalizeUrl(urlInput.value);
          if (!url) return;
          iframe.src = url;
          updateIframeUrlDisplay();
          appendLog("iframe src = " + url);
        });

      iframe.addEventListener("load", updateIframeUrlDisplay);

      // Align with Ramp: window.parent.postMessage({ type: "orderClosed", ... }, "*")
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.type === "orderClosed") {
          appendLog(
            "orderClosed from " +
              event.origin +
              "\n" +
              JSON.stringify(data, null, 2)
          );
          // Telegram Mini App 正式环境可在此：
          // if (window.Telegram && Telegram.WebApp) Telegram.WebApp.close();
          return;
        }

        if (data.type === "close") {
          appendLog("close from " + event.origin);
        }
      });
    </script>
  </body>
</html>
