<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merchant Ramp iframe Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1a1a1a;
        background: #f5f5f5;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .intro {
        margin: 0 0 4px;
        color: #333;
      }
      .security-note {
        margin: 0 0 16px;
        font-size: 12px;
        color: #666;
      }
      .panel {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls label {
        flex: 1 1 280px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .controls input[type="url"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 13px;
      }
      .controls button {
        padding: 8px 14px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }
      .controls button.secondary {
        background: #fff;
        color: #1a1a1a;
      }
      .controls button:hover {
        opacity: 0.9;
      }
      #ramp-iframe {
        display: block;
        width: 100%;
        min-height: 580px;
        height: 70vh;
        border: 1px solid #ddd;
        background: #fff;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .panel-header h2 {
        margin: 0;
      }
      .order-fields {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 6px 12px;
        margin-bottom: 12px;
      }
      .order-fields dt {
        margin: 0;
        color: #666;
        font-weight: 500;
      }
      .order-fields dd {
        margin: 0;
        word-break: break-all;
      }
      .order-fields .empty {
        color: #999;
        font-style: italic;
      }
      pre.json {
        margin: 0 0 12px;
        padding: 10px;
        background: #f8f8f8;
        border: 1px solid #eee;
        border-radius: 4px;
        overflow: auto;
        max-height: 240px;
        font-size: 12px;
      }
      #log-list {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 200px;
        overflow: auto;
      }
      #log-list li {
        padding: 8px 10px;
        border-bottom: 1px solid #eee;
        font-size: 12px;
      }
      #log-list li:last-child {
        border-bottom: none;
      }
      #log-list li.latest {
        background: #fff8e6;
        border-left: 3px solid #e6a800;
      }
      .log-meta {
        color: #666;
        margin-bottom: 4px;
      }
      .placeholder {
        color: #999;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Merchant Ramp iframe Demo</h1>

    <div class="panel">
      <div class="controls">
        <label>
          Ramp URL
          <input
            id="url-input"
            type="url"
            value="https://ramp-test.alchemytech.cc/demo/index.html"
          />
        </label>
        <button id="load-btn" type="button">加载 / 打开</button>
        <button id="clear-btn" class="secondary" type="button">清空日志</button>
      </div>
    </div>

    <iframe
      id="ramp-iframe"
      title="Alchemy Pay Ramp"
      src="https://ramp-test.alchemytech.cc/demo/index.html"
      allow="camera; microphone; payment; clipboard-read; clipboard-write"
    ></iframe>

    <div class="panel" style="margin-top: 12px">
      <div class="panel-header">
        <h2>orderClosed 订单详情</h2>
        <span id="detail-time" class="placeholder">尚未收到消息</span>
      </div>
      <dl id="order-fields" class="order-fields">
        <!-- filled by JS -->
      </dl>
      <h2>完整 event.data</h2>
      <pre id="json-view" class="json placeholder">等待 orderClosed…</pre>
      <h2>事件日志</h2>
      <ul id="log-list">
        <li class="placeholder">暂无日志</li>
      </ul>
    </div>
  </body>
</html>
