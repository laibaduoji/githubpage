<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #app,
      .viewbox {
        width: 100%;
        height: 100%;
        font-size: 0.16rem;
        overflow: hidden;
      }
      .viewbox {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        position: relative;
      }
      #app {
        width: 375px;
        height: 500px;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 10px 0;
        display: flex;
        justify-content: center;
      }
      .inner {
        background: lightblue;
        /* display: flex; */
        /* flex-direction: column; */
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div class="viewbox">
      <div id="app">
        <div class="inner"></div>
      </div>
    </div>
  </body>
</html>
