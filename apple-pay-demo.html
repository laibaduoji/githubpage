<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Pay iframe Parent</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1a1a1a;
        background: #f5f5f5;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .intro {
        margin: 0 0 4px;
        color: #333;
      }
      .note {
        margin: 0 0 16px;
        font-size: 12px;
        color: #666;
      }
      .panel {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls label {
        flex: 1 1 280px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .controls input[type="url"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 13px;
      }
      .controls button {
        padding: 8px 14px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }
      .controls button:hover {
        opacity: 0.9;
      }
      #apple-pay-iframe {
        display: block;
        width: 100%;
        min-height: 580px;
        height: 80vh;
        border: 1px solid #ddd;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Apple Pay iframe 父页</h1>
    <p class="intro">
      模拟商户站点用 iframe 嵌入 Ramp Apple Pay 页。Apple Pay 在 iframe
      内执行；本页只负责提供 <code>payment</code> 权限。
    </p>
    <p class="note">
      当前父页：<code id="origin"></code>。iframe 应对齐
      <code>ramp-test.alchemytech.cc</code>（与 merchant session
      <code>domainName</code> 一致）。
    </p>

    <div class="panel">
      <div class="controls">
        <label>
          iframe URL
          <input
            id="url-input"
            type="url"
            value="https://ramp-test.alchemytech.cc/demo/apple-pay-demo.html"
          />
        </label>
        <button id="load-btn" type="button">加载 / 打开</button>
      </div>
    </div>

    <iframe
      id="apple-pay-iframe"
      title="Apple Pay Demo"
      src="https://ramp-test.alchemytech.cc/demo/apple-pay-demo.html"
      allow="payment; camera; microphone; clipboard-read; clipboard-write"
      allowpaymentrequest
    ></iframe>

    <script>
      var DEFAULT_URL =
        "https://ramp-test.alchemytech.cc/demo/apple-pay-demo.html";
      var originEl = document.getElementById("origin");
      var urlInput = document.getElementById("url-input");
      var loadBtn = document.getElementById("load-btn");
      var iframe = document.getElementById("apple-pay-iframe");

      originEl.textContent = location.origin;

      loadBtn.addEventListener("click", function () {
        var url = (urlInput.value || DEFAULT_URL).trim();
        iframe.src = url;
      });
    </script>
  </body>
</html>
